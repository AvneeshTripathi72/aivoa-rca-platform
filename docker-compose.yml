version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aivoa-postgres
    restart: always
    environment:
      POSTGRES_USER: aivoa_user
      POSTGRES_PASSWORD: aivoa_password
      POSTGRES_DB: aivoa_rca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivoa_user -d aivoa_rca"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aivoa-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://aivoa_user:aivoa_password@db:5432/aivoa_rca
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
